apiVersion: apps/v1
kind: Deployment
metadata:
  name: registryx-backend
  namespace: registryx
spec:
  replicas: 1 # Scale this up for high availability
  selector:
    matchLabels:
      app: registryx-backend
  template:
    metadata:
      labels:
        app: registryx-backend
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h registryx-db -U registryx; do echo waiting for db; sleep 2; done;",
            ]
      containers:
        - name: backend
          image: registryx/backend:latest # REPLACE WITH YOUR IMAGE
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
              name: registryx-config
            - secretRef:
              name: registryx-secrets
          env:
            # Manually constructing DB URL to interpret secrets
            - name: DATABASE_URL
              value: "postgres://registryx:$(POSTGRES_PASSWORD)@registryx-db:5432/registryx?sslmode=disable"
          volumeMounts:
            - name: trivy-cache
              mountPath: /root/.cache/trivy
      volumes:
        - name: trivy-cache
          persistentVolumeClaim:
            claimName: trivy-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trivy-pvc
  namespace: registryx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: registryx-backend
  namespace: registryx
spec:
  type: LoadBalancer # Use ClusterIP if using Ingress
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: registryx-backend
