apiVersion: apps/v1
kind: Deployment
metadata:
  name: registryx-db
  namespace: registryx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registryx-db
  template:
    metadata:
      labels:
        app: registryx-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "registryx"
            - name: POSTGRES_DB
              value: "registryx"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: registryx-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "registryx"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: registryx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: registryx-db
  namespace: registryx
spec:
  ports:
    - port: 5432
  selector:
    app: registryx-db
