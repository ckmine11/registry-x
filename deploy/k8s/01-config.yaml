apiVersion: v1
kind: Namespace
metadata:
  name: registryx

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registryx-config
  namespace: registryx
data:
  SERVER_PORT: ":5000"
  DATABASE_URL: "postgres://registryx:$(POSTGRES_PASSWORD)@registryx-db:5432/registryx?sslmode=disable"
  REDIS_ADDR: "registryx-redis:6379"
  MINIO_ENDPOINT: "registryx-minio:9000"
  S3_BUCKET: "registryx-data"
  MINIO_SECURE: "false"
  POLICY_ENVIRONMENT: "production"
  ENABLE_IMMUTABLE_TAGS: "false"
  ENABLE_COST_INTELLIGENCE: "true"

  # URLs & CORS
  BACKEND_URL: "http://localhost:5000"
  FRONTEND_URL: "http://localhost:5173"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173"

  # Cost Intelligence (Defaulting to On-Prem matching the .env)
  COST_MODE: "ONPREM"
  STORAGE_CAPACITY_TB: "50"
  STORAGE_COST_PER_GB_MONTH: "0.03"
  BANDWIDTH_COST_PER_GB: "0.09"

  # Email Settings
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM: "registryx-noreply@example.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: registryx-secrets
  namespace: registryx
type: Opaque
stringData:
  # CHANGE THESE IN PRODUCTION!
  POSTGRES_PASSWORD: "secure-postgres-password-change-me"
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "secure-minio-password-change-me"
  JWT_SECRET: "secure-random-secret-key-change-me"
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASS: "your-app-password"
  REGISTRYX_LICENSE_KEY: ""
