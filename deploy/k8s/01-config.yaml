apiVersion: v1
kind: Namespace
metadata:
  name: registryx

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registryx-config
  namespace: registryx
data:
  SERVER_PORT: ":5000"
  DATABASE_URL: "postgres://registryx:$(POSTGRES_PASSWORD)@registryx-db:5432/registryx?sslmode=disable"
  REDIS_ADDR: "registryx-redis:6379"
  MINIO_ENDPOINT: "registryx-minio:9000"
  S3_BUCKET: "registryx-data"
  MINIO_SECURE: "false"
  POLICY_ENVIRONMENT: "production"
  ENABLE_IMMUTABLE_TAGS: "false"
  ENABLE_COST_INTELLIGENCE: "true"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM: "registryx-noreply@example.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: registryx-secrets
  namespace: registryx
type: Opaque
stringData:
  # CHANGE THESE IN PRODUCTION!
  POSTGRES_PASSWORD: "password123"
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "password123"
  JWT_SECRET: "change-this-secret-key-immediately"
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASS: "your-app-password"
